<svg viewBox="0 0 1500 970" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1500" height="970" fill="#F7F9F8"/>
  <text x="750" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#17332F">Hospital Management System — ER Diagram (v3)</text>
  <text x="750" y="64" text-anchor="middle" font-size="14" fill="#4A5B57">9 tables, 3NF-normalized · adds department-based doctor referral logic</text>

  <defs>
    <marker id="crow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#5C6F6A" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- USERS -->
  <g>
    <rect x="60" y="110" width="220" height="170" rx="6" fill="#FFFFFF" stroke="#1B6B63" stroke-width="2"/>
    <rect x="60" y="110" width="220" height="34" rx="6" fill="#1B6B63"/>
    <text x="170" y="133" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="700">USERS</text>
    <text x="72" y="164" font-size="12.5" fill="#17332F">PK  user_id</text>
    <text x="72" y="184" font-size="12.5" fill="#33423F">username</text>
    <text x="72" y="204" font-size="12.5" fill="#33423F">password_hash</text>
    <text x="72" y="224" font-size="12.5" fill="#33423F">role (admin/doctor/recep.)</text>
    <text x="72" y="244" font-size="12.5" fill="#33423F">email</text>
    <text x="72" y="264" font-size="12.5" fill="#B9812A">is_active  ← Activate/Deactivate</text>
  </g>

  <!-- DOCTORS -->
  <g>
    <rect x="60" y="330" width="220" height="170" rx="6" fill="#FFFFFF" stroke="#1B6B63" stroke-width="2"/>
    <rect x="60" y="330" width="220" height="34" rx="6" fill="#1B6B63"/>
    <text x="170" y="353" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="700">DOCTORS</text>
    <text x="72" y="384" font-size="12.5" fill="#17332F">PK  doctor_id</text>
    <text x="72" y="404" font-size="12.5" fill="#7A5B00">FK  user_id → USERS</text>
    <text x="72" y="424" font-size="12.5" fill="#33423F">name</text>
    <text x="72" y="444" font-size="12.5" fill="#33423F">specialization</text>
    <text x="72" y="464" font-size="12.5" fill="#B9812A">department ← referral key (v3)</text>
    <text x="72" y="484" font-size="12.5" fill="#33423F">phone, email</text>
  </g>

  <!-- STAFF -->
  <g>
    <rect x="60" y="550" width="220" height="130" rx="6" fill="#FFFFFF" stroke="#1B6B63" stroke-width="2"/>
    <rect x="60" y="550" width="220" height="34" rx="6" fill="#1B6B63"/>
    <text x="170" y="573" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="700">STAFF</text>
    <text x="72" y="604" font-size="12.5" fill="#17332F">PK  staff_id</text>
    <text x="72" y="624" font-size="12.5" fill="#7A5B00">FK  user_id → USERS</text>
    <text x="72" y="644" font-size="12.5" fill="#33423F">name, designation</text>
    <text x="72" y="664" font-size="12.5" fill="#33423F">department, phone</text>
  </g>

  <!-- PATIENTS -->
  <g>
    <rect x="380" y="110" width="230" height="170" rx="6" fill="#FFFFFF" stroke="#1B6B63" stroke-width="2"/>
    <rect x="380" y="110" width="230" height="34" rx="6" fill="#1B6B63"/>
    <text x="495" y="133" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="700">PATIENTS</text>
    <text x="392" y="164" font-size="12.5" fill="#17332F">PK  patient_id</text>
    <text x="392" y="184" font-size="12.5" fill="#33423F">name, age, gender</text>
    <text x="392" y="204" font-size="12.5" fill="#33423F">contact_no, address</text>
    <text x="392" y="224" font-size="12.5" fill="#33423F">blood_group</text>
    <text x="392" y="244" font-size="12.5" fill="#33423F">registered_on</text>
  </g>

  <!-- APPOINTMENTS (updated) -->
  <g>
    <rect x="380" y="330" width="240" height="230" rx="6" fill="#FFFFFF" stroke="#1B6B63" stroke-width="2"/>
    <rect x="380" y="330" width="240" height="34" rx="6" fill="#1B6B63"/>
    <text x="500" y="353" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="700">APPOINTMENTS</text>
    <text x="392" y="384" font-size="12.5" fill="#17332F">PK  appointment_id</text>
    <text x="392" y="404" font-size="12.5" fill="#7A5B00">FK  patient_id → PATIENTS</text>
    <text x="392" y="424" font-size="12.5" fill="#7A5B00">FK  doctor_id → DOCTORS</text>
    <text x="392" y="444" font-size="12.5" fill="#33423F">appointment_date/time</text>
    <text x="392" y="464" font-size="12.5" fill="#33423F">priority</text>
    <text x="392" y="484" font-size="12.5" fill="#B9812A">status +Checked-in ← reception</text>
    <text x="392" y="504" font-size="12.5" fill="#B9812A">notes ← doctor's consult</text>
    <text x="392" y="524" font-size="12.5" fill="#33423F">reason</text>
  </g>

  <!-- ADMISSIONS -->
  <g>
    <rect x="380" y="600" width="240" height="170" rx="6" fill="#FFFFFF" stroke="#1B6B63" stroke-width="2"/>
    <rect x="380" y="600" width="240" height="34" rx="6" fill="#1B6B63"/>
    <text x="500" y="623" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="700">ADMISSIONS</text>
    <text x="392" y="654" font-size="12.5" fill="#17332F">PK  admission_id</text>
    <text x="392" y="674" font-size="12.5" fill="#7A5B00">FK  patient_id → PATIENTS</text>
    <text x="392" y="694" font-size="12.5" fill="#7A5B00">FK  room_no → ROOMS</text>
    <text x="392" y="714" font-size="12.5" fill="#7A5B00">FK  doctor_id → DOCTORS</text>
    <text x="392" y="734" font-size="12.5" fill="#33423F">admission_date, discharge_date</text>
    <text x="392" y="754" font-size="12.5" fill="#33423F">diagnosis</text>
  </g>

  <!-- ROOMS -->
  <g>
    <rect x="60" y="800" width="220" height="150" rx="6" fill="#FFFFFF" stroke="#1B6B63" stroke-width="2"/>
    <rect x="60" y="800" width="220" height="34" rx="6" fill="#1B6B63"/>
    <text x="170" y="823" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="700">ROOMS</text>
    <text x="72" y="854" font-size="12.5" fill="#17332F">PK  room_no</text>
    <text x="72" y="874" font-size="12.5" fill="#33423F">room_type, floor</text>
    <text x="72" y="894" font-size="12.5" fill="#33423F">charge_per_day</text>
    <text x="72" y="914" font-size="12.5" fill="#33423F">status ← Add room / Admit / Discharge</text>
  </g>

  <!-- PRESCRIPTIONS -->
  <g>
    <rect x="740" y="330" width="240" height="210" rx="6" fill="#FFFFFF" stroke="#1B6B63" stroke-width="2"/>
    <rect x="740" y="330" width="240" height="34" rx="6" fill="#1B6B63"/>
    <text x="860" y="353" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="700">PRESCRIPTIONS</text>
    <text x="752" y="384" font-size="12.5" fill="#17332F">PK  prescription_id</text>
    <text x="752" y="404" font-size="12.5" fill="#7A5B00">FK  patient_id → PATIENTS</text>
    <text x="752" y="424" font-size="12.5" fill="#7A5B00">FK  doctor_id → DOCTORS</text>
    <text x="752" y="444" font-size="12.5" fill="#7A5B00">FK  appointment_id → APPTS.</text>
    <text x="752" y="464" font-size="12.5" fill="#33423F">medicines</text>
    <text x="752" y="484" font-size="12.5" fill="#33423F">date_issued</text>
    <text x="752" y="504" font-size="12.5" fill="#B9812A">← auto-created by "Consult"</text>
  </g>

  <!-- BILLING -->
  <g>
    <rect x="740" y="600" width="240" height="210" rx="6" fill="#FFFFFF" stroke="#1B6B63" stroke-width="2"/>
    <rect x="740" y="600" width="240" height="34" rx="6" fill="#1B6B63"/>
    <text x="860" y="623" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="700">BILLING</text>
    <text x="752" y="654" font-size="12.5" fill="#17332F">PK  billing_id</text>
    <text x="752" y="674" font-size="12.5" fill="#7A5B00">FK  patient_id → PATIENTS</text>
    <text x="752" y="694" font-size="12.5" fill="#7A5B00">FK  admission_id → ADMISSIONS</text>
    <text x="752" y="714" font-size="12.5" fill="#7A5B00">FK  appointment_id → APPTS.</text>
    <text x="752" y="734" font-size="12.5" fill="#33423F">amount, payment_mode</text>
    <text x="752" y="754" font-size="12.5" fill="#33423F">payment_status</text>
    <text x="752" y="774" font-size="12.5" fill="#33423F">billing_date</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="1060" y="110" width="380" height="190" rx="6" fill="#FFFFFF" stroke="#DDE3E1" stroke-width="1.5"/>
    <text x="1080" y="138" font-size="14" font-weight="700" fill="#17332F">Legend</text>
    <text x="1080" y="164" font-size="12.5" fill="#17332F">PK  — Primary Key</text>
    <text x="1080" y="186" font-size="12.5" fill="#7A5B00">FK  — Foreign Key</text>
    <text x="1080" y="208" font-size="12.5" fill="#B9812A">Amber note — added for the multi-portal UI</text>
    <text x="1080" y="234" font-size="12.5" fill="#33423F">Lines: 1 —&#8811; N relationship</text>
    <text x="1080" y="256" font-size="12.5" fill="#33423F">(one doctor → many appointments,</text>
    <text x="1080" y="274" font-size="12.5" fill="#33423F">one patient → many bills, etc.)</text>
  </g>

  <!-- What's new box -->
  <g>
    <rect x="1060" y="330" width="380" height="300" rx="6" fill="#E4EEEC" stroke="#1B6B63" stroke-width="1"/>
    <text x="1080" y="358" font-size="14" font-weight="700" fill="#0F423C">What changed (v3)</text>
    <text x="1080" y="384" font-size="12" fill="#17332F">• No new tables or columns — referral logic</text>
    <text x="1092" y="402" font-size="12" fill="#17332F">reuses doctors.department + existing rows</text>
    <text x="1080" y="424" font-size="12" fill="#17332F">• GET /api/departments lists departments</text>
    <text x="1092" y="442" font-size="12" fill="#17332F">on file, for the Department dropdown</text>
    <text x="1080" y="464" font-size="12" fill="#17332F">• GET /api/doctors/suggest keyword-matches</text>
    <text x="1092" y="482" font-size="12" fill="#17332F">reason/diagnosis text → department, then</text>
    <text x="1092" y="500" font-size="12" fill="#17332F">ranks doctors by current load (today's</text>
    <text x="1092" y="518" font-size="12" fill="#17332F">appointments, or open admissions)</text>
    <text x="1080" y="540" font-size="12" fill="#17332F">• Staff can always override the suggestion</text>
    <text x="1080" y="562" font-size="12" fill="#17332F">• v2 changes (Checked-in, notes, is_active)</text>
    <text x="1092" y="580" font-size="12" fill="#17332F">still apply — see schema.sql comments</text>
    <text x="1080" y="606" font-size="12" fill="#17332F">• table structure otherwise unchanged</text>
  </g>

  <!-- Relationship lines -->
  <line x1="170" y1="280" x2="170" y2="330" stroke="#5C6F6A" stroke-width="1.6" marker-end="url(#crow)"/>
  <path d="M280,200 C 330,200 330,565 280,590" fill="none" stroke="#5C6F6A" stroke-width="1.6" marker-end="url(#crow)"/>
  <line x1="495" y1="280" x2="500" y2="330" stroke="#5C6F6A" stroke-width="1.6" marker-end="url(#crow)"/>
  <line x1="500" y1="560" x2="500" y2="600" stroke="#5C6F6A" stroke-width="1.6" marker-end="url(#crow)"/>
  <line x1="280" y1="420" x2="380" y2="420" stroke="#5C6F6A" stroke-width="1.6" marker-end="url(#crow)"/>
  <path d="M280,470 C 330,470 330,690 380,690" fill="none" stroke="#5C6F6A" stroke-width="1.6" marker-end="url(#crow)"/>
  <path d="M280,870 C 330,870 330,700 380,700" fill="none" stroke="#5C6F6A" stroke-width="1.6" marker-end="url(#crow)"/>
  <line x1="620" y1="420" x2="740" y2="420" stroke="#5C6F6A" stroke-width="1.6" marker-end="url(#crow)"/>
  <path d="M610,190 C 900,190 900,340 860,330" fill="none" stroke="#5C6F6A" stroke-width="1.6" marker-end="url(#crow)"/>
  <path d="M610,260 C 960,260 960,600 860,600" fill="none" stroke="#5C6F6A" stroke-width="1.6" marker-end="url(#crow)"/>
  <line x1="620" y1="700" x2="740" y2="680" stroke="#5C6F6A" stroke-width="1.6" marker-end="url(#crow)"/>
  <line x1="620" y1="480" x2="740" y2="630" stroke="#5C6F6A" stroke-width="1.6" marker-end="url(#crow)"/>

  <text x="750" y="945" text-anchor="middle" font-size="12" fill="#4A5B57">Boxes = tables · Green PK / Amber FK rows · Arrows point from "one" side to "many" side</text>
</svg>
