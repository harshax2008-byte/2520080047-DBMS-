<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediCore HMS</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7F6;--sf:#fff;--ink:#132420;--soft:#5A6B67;--line:#E0E7E4;--teal:#1B6B63;--dk:#0F423C;--tint:#E4EEEC;--amb:#B9812A;--red:#AD3B2E;--grn:#2E7D5B;--r:6px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;margin:0;font-weight:600}button,input,select{font:inherit}
.hide{display:none!important}svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#dcebe7,transparent 45%),var(--bg)}
.lcard{width:100%;max-width:420px;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:36px;box-shadow:0 8px 30px rgba(15,66,60,.08)}
.brand{display:flex;align-items:center;gap:10px;font:600 19px "Source Serif 4",serif}.logo{width:30px;height:30px;border-radius:7px;background:var(--teal);color:#fff;display:grid;place-items:center;font:700 20px/1 Inter}
.lcard h1{font-size:24px;margin:24px 0 4px}.sub{color:var(--soft);margin:0 0 20px}
.field{margin-bottom:14px}.field label{display:block;font-size:12.5px;color:var(--soft);margin-bottom:5px;font-weight:500}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff;color:var(--ink)}
.field input:focus,.field select:focus,.btn:focus-visible,.nav button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px 4px;border:1px solid var(--line);background:#fff;border-radius:var(--r);color:var(--soft);cursor:pointer}
.seg button.on{border-color:var(--teal);background:var(--tint);color:var(--dk);font-weight:600}
.btn{background:var(--teal);color:#fff;border:0;border-radius:var(--r);padding:9px 16px;font-weight:600;cursor:pointer}.btn:hover{background:var(--dk)}
.btn.full{width:100%;padding:11px}.btn.ghost{background:#fff;color:var(--soft);border:1px solid var(--line)}.btn.ghost:hover{color:var(--ink);border-color:var(--soft)}
.btn.sm{padding:4px 10px;font-size:12px;font-weight:500}.btn.sm.ok{background:var(--tint);color:var(--dk)}.btn.sm.no{background:#fbeae7;color:var(--red)}
.err{color:var(--red);font-size:12.5px;min-height:18px;margin:0 0 6px}.hint{font-size:12px;color:var(--soft);text-align:center;margin:14px 0 0}
#app{display:none;min-height:100vh}#app.on{display:grid;grid-template-columns:240px 1fr}
.side{background:var(--dk);color:#fff;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}.side .logo{background:#fff;color:var(--dk);width:26px;height:26px;font-size:17px}
.nav button{display:flex;gap:11px;align-items:center;width:100%;padding:10px 12px;margin-bottom:2px;border:0;border-radius:var(--r);background:none;color:rgba(255,255,255,.72);cursor:pointer;text-align:left}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}.nav button.on{background:rgba(255,255,255,.15);color:#fff;font-weight:600;box-shadow:inset 3px 0 var(--amb)}
.me{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--dk);display:grid;place-items:center;font-weight:600;flex:none}.me b{display:block;font-size:13px}.me span{font-size:12px;opacity:.65}
.me button{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.7);cursor:pointer;padding:6px}.me button:hover{color:#fff}
.main{min-width:0}.top{display:flex;align-items:center;gap:16px;padding:14px 32px;background:var(--sf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top input{flex:1;max-width:380px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}.date{margin-left:auto;color:var(--soft);font-size:13px}
.page{padding:26px 32px 60px}.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}.ph small{color:var(--teal);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}.ph h2{font-size:26px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}.stat b{display:block;font:600 28px "Source Serif 4",serif;color:var(--dk)}.stat span{color:var(--soft);font-size:12.5px}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:20px}.panel{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px;overflow:hidden}
.ph2{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.ph2 h3{font-size:16px}.ph2 span{font-size:12px;color:var(--soft)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);padding:10px 18px;background:#FAFCFB;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 18px;border-bottom:1px solid var(--line);white-space:nowrap}tbody tr:last-child td{border:0}tbody tr:hover{background:#F8FBFA}.mut{color:var(--soft)}.empty{padding:30px;text-align:center;color:var(--soft)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.c-emergency,.c-cancelled{background:#fbeae7;color:var(--red)}.c-critical,.c-pending,.c-partial{background:#fbf1df;color:#8a5d10}.c-general{background:#eef1f0;color:var(--soft)}.c-scheduled{background:#e4eef6;color:#28587a}.c-completed,.c-paid,.c-available{background:#e7f3ed;color:var(--grn)}.c-occupied{background:#fbeae7;color:var(--red)}.c-maintenance{background:#fbf1df;color:#8a5d10}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.room{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px}.room h3{font-size:18px}.room p{margin:2px 0 10px;color:var(--soft);font-size:12.5px}.room .btn{margin-top:10px;width:100%}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--teal)}.pad{padding:16px 18px}.row{display:flex;justify-content:space-between;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(12,24,21,.5);display:none;place-items:center;z-index:20;padding:16px}#modal.on{display:grid}
.modal{background:#fff;border-radius:10px;width:100%;max-width:480px;padding:26px;max-height:90vh;overflow:auto}.modal h3{font-size:19px;margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.g2 .full{grid-column:1/-1}.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
#toast{position:fixed;bottom:22px;right:22px;background:var(--dk);color:#fff;padding:11px 16px;border-radius:var(--r);opacity:0;transform:translateY(10px);transition:.25s;z-index:30;pointer-events:none}#toast.on{opacity:1;transform:none}
#login{grid-template-columns:1fr 1fr;place-items:stretch;padding:0;background:var(--bg)}
.lside{background:linear-gradient(160deg,var(--dk),var(--teal));color:#fff;padding:64px;display:flex;flex-direction:column;justify-content:center}.lside .brand{font-size:20px}.lside h2{font-size:36px;line-height:1.2;margin:40px 0 24px;max-width:430px}.lside ul{list-style:none;padding:0;margin:0}.lside li{padding:8px 0 8px 28px;position:relative;color:rgba(255,255,255,.85)}.lside li:before{content:"\2713";position:absolute;left:0;color:#E0A84A;font-weight:700}
.lmain{display:grid;place-items:center;padding:24px}.lcard{box-shadow:none}
.stat{display:flex;gap:14px;align-items:center;box-shadow:0 1px 2px rgba(15,66,60,.05)}.si{width:44px;height:44px;border-radius:10px;background:var(--tint);color:var(--teal);display:grid;place-items:center;flex:none}.si svg{width:21px;height:21px}
.panel{box-shadow:0 1px 2px rgba(15,66,60,.05)}.crumb{color:var(--soft);font-size:13px;white-space:nowrap}.crumb b{color:var(--ink);font-weight:600}
.pav{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--dk);font-size:11px;font-weight:600;margin-right:10px;vertical-align:middle}
.acts2{display:flex;gap:8px;flex-wrap:wrap}.btn.sec{background:#fff;color:var(--dk);border:1px solid var(--line)}.btn.sec:hover{background:var(--tint)}
.room{border-top:3px solid var(--line);transition:.15s}.room:hover{box-shadow:0 6px 16px rgba(15,66,60,.09);transform:translateY(-1px)}.room.Available{border-top-color:var(--grn)}.room.Occupied{border-top-color:var(--red)}.room.Maintenance{border-top-color:var(--amb)}
.sec-t{font:600 19px "Source Serif 4",serif;margin:28px 0 12px}
.r-admin{--teal:#33478A;--dk:#1E2B57;--tint:#E6EAF6}.r-receptionist{--teal:#9C6A1E;--dk:#5E3F0F;--tint:#F6EEDD}
.c-active{background:#e7f3ed;color:var(--grn)}.c-suspended{background:#fbeae7;color:var(--red)}.c-checked-in{background:#efe9fb;color:#5b3f9b}
#landing{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 80% 10%,#dcebe7,transparent 40%),var(--bg)}.lw{max-width:1000px;width:100%}.lw h1{font-size:34px;margin:30px 0 6px}
.portals{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.portal{background:var(--sf);border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:12px;padding:26px;text-decoration:none;color:var(--ink);transition:.18s;display:block}.portal:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(15,66,60,.12)}
.portal .si{margin-bottom:16px}.portal h3{font-size:21px;margin-bottom:6px}.portal p{color:var(--soft);margin:0 0 18px;min-height:64px}.portal span{color:var(--teal);font-weight:600}
.lside .tag{margin-top:38px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#E0A84A;font-weight:600}.lside h2{margin:10px 0 24px}
.portal{cursor:pointer}.back{background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:13px;display:inline-block;margin-bottom:18px;color:var(--soft);font-size:13px;text-decoration:none}.back:hover{color:var(--ink)}
.qa{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.sec-s{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--teal);margin:16px 0 4px}
@media(max-width:900px){#login{grid-template-columns:1fr}.lside{display:none}.portals{grid-template-columns:1fr}#app.on{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px}.side .brand{border:0;padding:0 10px 0 0;margin:0}.nav{display:flex}.nav button{white-space:nowrap;width:auto}.me{display:none}.stats{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.page,.top{padding-left:16px;padding-right:16px}.date{display:none}}
</style>
</head>
<body>
<div id="landing"><div class="lw"><div class="brand"><div class="logo">+</div>MediCore HMS</div><h1>Welcome. Choose your portal.</h1><p class="sub">Each role has its own workspace, tools and permissions.</p><div class="portals" id="portals"></div></div></div>
<div id="login" class="hide"><div class="lside" id="ls"></div><div class="lmain"><div class="lcard">
  <button class="back" id="bk" type="button">&larr; All portals</button>
  <h1 id="lh" style="font-size:24px;margin:0 0 4px"></h1><p class="sub" id="lsub"></p>
  <div class="field" id="lnw"><label for="ln">Full name</label><input id="ln" placeholder="e.g. Priya M" autocomplete="name"></div>
  <div class="field hide" id="ldw"><label for="ld">Doctor profile</label><select id="ld"></select></div>
  <div class="field"><label for="lu">Username</label><input id="lu" autocomplete="username"></div>
  <div class="field"><label for="lp">Password</label><input id="lp" type="password" placeholder="••••••••" autocomplete="current-password"></div>
  <p class="err" id="lerr"></p><button class="btn full" id="lgo">Sign in</button>
  <p class="hint">Demo mode: any credentials are accepted.</p>
</div></div></div>
<div id="app">
  <aside class="side"><div class="brand"><div class="logo">+</div>MediCore</div><nav class="nav" id="nav"></nav>
    <div class="me"><div class="av" id="av"></div><div><b id="mn"></b><span id="mr"></span></div><button id="out" title="Sign out" aria-label="Sign out"></button></div></aside>
  <div class="main"><div class="top"><span class="crumb" id="cr"></span><input id="q" type="search" placeholder="Search this page…" aria-label="Search this page"><span class="date" id="dt"></span></div><div class="page" id="page"></div></div>
</div>
<div id="modal"></div><div id="toast" role="status"></div>
<script>
/* Presentation layer only. Replace the seed arrays and the mutating functions below with fetch() calls to the Flask API (/api/patients, /api/appointments, ...). */
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)},money=n=>'₹'+Number(n).toLocaleString('en-IN');
const IC={grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',bed:'<path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8M2 16h20M6 10V6h5v4"/>',pill:'<path d="M10.5 20.5 3.5 13.5a4.95 4.95 0 0 1 7-7l7 7a4.95 4.95 0 0 1-7 7zM8.5 8.5l7 7"/>',rec:'<path d="M4 2v20l3-2 3 2 3-2 3 2 3-2V2zM8 7h8M8 11h8M8 15h5"/>',shield:'<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/>',pulse:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'};
const ini=n=>n.replace(/^(dr|mr|ms)\.?\s/i,"").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();const ico=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const P=['T. Harsha Vardhan|21|M|9000000001|O+','G. Anirudh|21|M|9000000002|B+','S. Lakshmi|58|F|9847213065|A+','Mohammed Ayaan|34|M|9663210987|B-','P. Divya Sri|27|F|9912345678|O-','R. Venkateswarlu|64|M|9440098765|AB+','K. Anitha|45|F|9887766554|A-','Syed Imran|8|M|9123456780|O+','N. Bhargavi|31|F|9556677889|B+','C. Ravi Teja|52|M|9234567891|AB-','D. Sowmya|19|F|9345678912|O+','V. Nagarjuna|71|M|9456789123|A+','A. Keerthi|29|F|9567891234|B+','M. Sai Kiran|38|M|9678912345|O-'];
let patients=P.map((r,i)=>{const [name,age,g,contact,blood]=r.split('|');return{id:i+1,name,age,g,contact,blood,reg:iso(-30+i*2)}});
let doctors=[[1,'Dr. K. Reddy','Cardiology'],[2,'Dr. A. Fatima','General Medicine'],[3,'Dr. S. Narayan','Orthopedics'],[4,'Dr. Meera Pillai','Pediatrics'],[5,'Dr. Vivek Menon','Neurology']].map(([id,name,dept])=>({id,name,dept}));
let appts=[[1,1,0,'09:15','Chest pain evaluation','Critical','Scheduled'],[8,4,0,'09:30','High fever, breathing trouble','Emergency','Scheduled'],[2,2,0,'10:00','Routine checkup','General','Checked-in'],[6,3,0,'10:30','Knee pain follow-up','General','Scheduled'],[9,5,0,'11:00','Recurring migraines','Critical','Scheduled'],[11,2,0,'11:30','Fever and body ache','General','Scheduled'],[3,1,0,'08:30','Post-op cardiac review','Critical','Completed'],[4,3,-1,'15:00','Fracture follow-up','General','Completed'],[5,4,-1,'16:00','Child vaccination','General','Completed'],[12,5,1,'09:00','Memory loss evaluation','Critical','Scheduled'],[13,2,1,'09:45','Prenatal checkup','General','Scheduled'],[14,1,1,'10:15','Hypertension review','General','Scheduled']].map((a,i)=>({id:i+1,pid:a[0],did:a[1],date:iso(a[2]),time:a[3],reason:a[4],prio:a[5],status:a[6]}));
let rooms=[['A-101','General',800,1],['A-102','Private',2500,3],['A-103','Semi-Private',1500,0],['A-104','General',800,0],['A-105','Semi-Private',1500,6],['B-201','General',800,0],['B-202','Private',2500,0],['B-203','General',800,-1],['ICU-01','ICU',6000,7],['ICU-02','ICU',6000,12],['ICU-03','ICU',6000,0],['ICU-04','ICU',6000,-1]].map(([no,type,rate,p])=>({no,type,rate,pid:p>0?p:0,status:p>0?'Occupied':p<0?'Maintenance':'Available'}));
let adm=rooms.filter(r=>r.pid).map((r,i)=>({id:i+1,pid:r.pid,room:r.no,did:i+1,dx:['Cardiac observation','Post-operative care','Pneumonia','Neurological monitoring','Fracture recovery'][i],date:iso(-(i+1)),out:''}));
let rx=[[1,1,'Aspirin 75mg 1-0-0 x 30 days; Atorvastatin 20mg 0-0-1 x 30 days',0],[8,4,'Paracetamol syrup 5ml 1-1-1 x 5 days; ORS as needed',0],[6,3,'Diclofenac 50mg 1-0-1 x 7 days; Calcium 500mg 1-0-0 x 30 days',0],[9,5,'Propranolol 40mg 1-0-1 x 15 days',0],[3,1,'Clopidogrel 75mg 1-0-0 x 90 days',0],[4,3,'Ibuprofen 400mg 1-0-1 x 5 days',-1],[11,2,'Paracetamol 650mg 1-1-1 x 3 days',0]].map((r,i)=>({id:i+1,pid:r[0],did:r[1],meds:r[2],date:iso(r[3])}));
let bills=[[1,3300,'Card','Pending',0],[3,18500,'Insurance','Partial',-2],[2,600,'UPI','Paid',0],[8,1200,'Cash','Paid',0],[6,2450,'UPI','Pending',0],[9,4100,'Card','Pending',0],[4,7600,'Insurance','Paid',-1],[5,850,'Cash','Paid',-1],[12,9800,'Card','Pending',1]].map((b,i)=>({id:i+1,pid:b[0],amt:b[1],mode:b[2],status:b[3],date:iso(b[4])}));
const nm=(list,id)=>esc((list.find(x=>x.id===id)||{name:'—'}).name),chip=t=>`<span class="chip c-${t.toLowerCase()}">${esc(t)}</span>`,RANK={Emergency:0,Critical:1,General:2};
const NAV=[['dashboard','Dashboard','grid'],['doctors','Doctors','pulse'],['users','Staff & users','shield'],['patients','Patients','users'],['appointments','Appointments','cal'],['rooms','Rooms & Admissions','bed'],['prescriptions','Prescriptions','pill'],['billing','Billing','rec']];
const ROLENAV={admin:['dashboard','doctors','users','patients','appointments','rooms','prescriptions','billing'],doctor:['dashboard','patients','appointments','rooms','prescriptions'],receptionist:['dashboard','patients','appointments','rooms','billing']};
const LBL={doctor:{dashboard:'My schedule',patients:'My patients',appointments:'My appointments',rooms:'Inpatients',prescriptions:'My prescriptions'},admin:{dashboard:'Overview'},receptionist:{dashboard:'Front desk'}};
const PERM={admin:['patient','appt','room','presc','bill','billing'],doctor:['appt','presc'],receptionist:['patient','appt','room','bill','billing']};
const ROLES={admin:{t:'Administrator',c:'#33478A',ic:'shield',h:'Run the whole hospital with full visibility.',d:'Manage doctors, staff accounts, finances and every department.',f:['Doctor and staff management','Workload and revenue reports','Full access to every department','User account control']},
doctor:{t:'Doctor',c:'#1B6B63',ic:'pulse',h:'Your patients, schedule and prescriptions in one place.',d:'See your day, consult patients, prescribe and follow inpatients.',f:['Personal daily schedule','Consultations with notes and prescriptions','Inpatient monitoring and discharge','Complete patient history']},
receptionist:{t:'Receptionist',c:'#9C6A1E',ic:'users',h:'A front desk that runs smoothly.',d:'Register and check in patients, book visits, admit and collect payments.',f:['Patient registration and check-in','Appointment booking','Room admissions','Billing and payment collection']}};
let role='admin',who='',view='dashboard',me=1;const can=a=>PERM[role].includes(a);
const tbl=(h,rows,empty)=>rows.length?`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty">${empty}</div>`;
const panel=(t,note,body)=>`<div class="panel"><div class="ph2"><h3>${t}</h3><span>${note||''}</span></div>${body}</div>`;
const queue=()=>appts.filter(a=>a.date===iso(0)).sort((a,b)=>RANK[a.prio]-RANK[b.prio]||a.time.localeCompare(b.time));

 $('ld').innerHTML=doctors.map(d=>`<option value="${d.id}">${esc(d.name)} — ${esc(d.dept)}</option>`).join('');$('lu').placeholder={admin:'Admin username',doctor:'Employee ID, e.g. DOC-104',receptionist:'Staff ID, e.g. FD-210'}[r];$('lerr').textContent=''}
function route(){if($('app').classList.contains('on'))return;const r=(location.hash.match(/^#\/(\w+)/)||[])[1];ROLES[r]?showLogin(r):showLanding()}
function login(){const dr=role==='doctor',n=dr?'':$('ln').value.trim();if((!dr&&!n)||!$('lu').value.trim()||!$('lp').value){$('lerr').textContent='Please fill in all fields.';return}
 if(dr){me=+$('ld').value;who=doctors.find(d=>d.id===me).name}else who=n;
 $('mn').textContent=who;$('mr').textContent=ROLES[role].t;$('av').textContent=who.replace(/^dr\.?\s/i,'').charAt(0).toUpperCase();
 $('login').classList.add('hide');$('app').classList.add('on');view='dashboard';render()}
$('portals').innerHTML=Object.entries(ROLES).map(([k,R])=>`<div class="portal" role="button" tabindex="0" data-r="${k}" style="--teal:${R.c};--tint:${R.c}18"><div class="si">${ico(R.ic)}</div><h3>${R.t}</h3><p>${R.d}</p><span>Sign in →</span></div>`).join('');document.querySelectorAll('.portal').forEach(el=>{el.onclick=()=>showLogin(el.dataset.r);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showLogin(el.dataset.r)}}});$('bk').onclick=showLanding;

$('lgo').onclick=login;['ln','lu','lp'].forEach(i=>$(i).addEventListener('keydown',e=>e.key==='Enter'&&login()));
$('out').innerHTML=ico('out');$('out').onclick=()=>{$('app').classList.remove('on');$('ln').value='';$('lu').value='';$('lp').value='';$('q').value='';showLanding()};
$('nav').onclick=e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;$('q').value='';render()}};$('q').oninput=search;
$('dt').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
$('modal').onclick=e=>{if(e.target.id==='modal')closeM()};document.addEventListener('keydown',e=>e.key==='Escape'&&closeM());
route();
</script>
</body>
</html>
